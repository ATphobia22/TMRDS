name: Synthetic Imaging Tools
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-imaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.lock -r deploy/imaging/requirements.txt
      - run: python -m pytest -q tests/test_imaging_synthetic_demo.py
      - run: python scripts/imaging_synthetic_demo.py
      - run: docker compose -f deploy/imaging/compose.yml config --quiet
