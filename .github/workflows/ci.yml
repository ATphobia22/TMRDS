name: TMRDS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python scripts/check_dependency_lock.py
      - run: python -m compileall -q api engines tests scripts
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t tmrds-api:ci .
      - run: python -m pytest -q tests/test_ibm_quantum_compute.py tests/test_ibm_quantum_job_ledger.py
      - run: python -m pytest -q -m "not integration"
