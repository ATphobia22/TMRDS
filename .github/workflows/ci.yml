name: TMRDS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - name: Validate dependency declarations and locks
        run: python scripts/check_dependency_lock.py
      - name: Validate immutable workflow actions and permissions
        run: python scripts/check_workflow_security.py
      - name: Scan repository for committed secret patterns
        run: python scripts/security_scan.py .
      - name: Generate route and declared-auth inventory
        run: mkdir -p build/audit && python scripts/audit_api_routes.py --output build/audit/route-auth-inventory.json
      - name: Upload route audit inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmrds-route-auth-inventory
          path: build/audit/route-auth-inventory.json
          if-no-files-found: error
          retention-days: 14
      - run: python -m compileall -q api engines tests scripts
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --pull -t tmrds-api:ci .
      - name: Smoke-test API container liveness
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f tmrds-api-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name tmrds-api-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env TMRDS_ENV=development \
            --env TMRDS_DATABASE_URL=postgresql:///tmrds \
            --env TMRDS_HMAC_SECRET=ci-only-placeholder-secret-not-for-production \
            --env TMRDS_SERVICE_AUTH_REQUIRED=false \
            tmrds-api:ci
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:18000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 tmrds-api-smoke
          exit 1
      - run: python -m pytest -q tests/test_ibm_quantum_compute.py tests/test_ibm_quantum_job_ledger.py
      - name: Full non-integration unit suite
        run: python -m pytest -q -m "not integration" --junitxml=test-results.xml
      - name: Upload CI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmrds-ci-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
