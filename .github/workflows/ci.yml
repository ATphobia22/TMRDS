name: TMRDS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock
      - name: Install locked test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Validate canonical and alias dependency locks
        run: python scripts/check_dependency_lock.py
      - name: Validate workflow supply-chain controls
        run: python scripts/check_workflow_security.py
      - name: Scan repository for committed secrets
        run: python scripts/security_scan.py .
      - name: Generate route and declared-auth inventory
        run: mkdir -p build/audit && python scripts/audit_api_routes.py --output build/audit/route-auth-inventory.json
      - name: Upload route audit inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmrds-route-auth-inventory
          path: build/audit/route-auth-inventory.json
          if-no-files-found: error
      - name: Compile Python modules
        run: python -m compileall -q api engines tests scripts
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build application image
        run: docker build --pull -t tmrds-api:ci .
      - name: Smoke-test API container liveness
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f tmrds-api-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name tmrds-api-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env TMRDS_ENV=development \
            --env TMRDS_DATABASE_URL=postgresql:///tmrds \
            --env TMRDS_HMAC_SECRET=ci-only-placeholder-secret-not-for-production \
            --env TMRDS_SERVICE_AUTH_REQUIRED=false \
            tmrds-api:ci
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:18000/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 tmrds-api-smoke
          exit 1
      - name: IBM Quantum mock-only lifecycle tests
        run: python -m pytest -q tests/test_ibm_quantum_compute.py tests/test_ibm_quantum_job_ledger.py
      - name: Full non-integration unit suite
        run: python -m pytest -q -m "not integration" --junitxml=test-results.xml
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmrds-ci-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
