name: TMRDS Security and Interoperability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Validate dependency locks and workflow security
        run: |
          python scripts/check_dependency_lock.py
          python scripts/check_workflow_security.py
      - name: Deterministic secret scan
        run: python scripts/security_scan.py .
      - name: Compile Python modules
        run: python -m compileall -q api engines scripts tests
      - name: Audit API route and declared-auth inventory
        run: python scripts/audit_api_routes.py --output api-route-inventory.json
      - name: Unit tests
        run: python -m pytest -q -m "not integration" --junitxml=test-results.xml
      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tmrds-test-results
          path: |
            test-results.xml
            api-route-inventory.json
          if-no-files-found: ignore
          retention-days: 14
