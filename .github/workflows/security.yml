name: TMRDS Security and Interoperability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock && python scripts/check_dependency_lock.py
      - name: Deterministic secret scan
        run: python scripts/security_scan.py .
      - name: Compile Python modules
        run: python -m compileall -q api engines scripts tests
      - name: Audit API route and declared-auth inventory
        run: python scripts/audit_api_routes.py --output api-route-inventory.json
      - name: Unit tests
        run: python -m pytest -q -m "not integration" --junitxml=test-results.xml
      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmrds-test-results
          path: |
            test-results.xml
            api-route-inventory.json
          if-no-files-found: ignore
