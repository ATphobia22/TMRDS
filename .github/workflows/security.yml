name: TMRDS Security and Interoperability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Deterministic secret scan
        run: python scripts/security_scan.py .
      - name: Compile Python modules
        run: python -m compileall -q api engines scripts tests
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
