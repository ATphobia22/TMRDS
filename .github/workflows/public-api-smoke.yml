name: TMRDS Public Research API HTTPS Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/check_deployed_research_api.py"
      - "tests/test_public_api_smoke_contract.py"
      - ".github/workflows/public-api-smoke.yml"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmrds-public-api-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Offline HTTPS monitor contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run offline policy tests
        run: python -m unittest discover -s tests -p test_public_api_smoke_contract.py -v

  public-https:
    name: Public research gateway and no-PHI contract
    if: github.event_name != 'pull_request'
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify independently hosted HTTPS API
        run: python scripts/check_deployed_research_api.py
      - name: Archive dated, hashed inspection receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        if: always()
        with:
          name: tmrds-public-api-smoke-receipt
          path: public-api-smoke-receipt.json
          if-no-files-found: ignore
          retention-days: 30
