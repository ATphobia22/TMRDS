name: TMRDS Release Verification

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install locked test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Validate release inputs
        run: |
          python scripts/check_dependency_lock.py
          python scripts/check_workflow_security.py
          python scripts/security_scan.py .
          python -m compileall -q api engines scripts tests
      - name: Run non-integration acceptance suite
        run: python -m pytest -q -m "not integration" --junitxml=build-release-test-results.xml
      - name: Build immutable release candidate image locally
        run: docker build --pull --tag "tmrds-api:release-${GITHUB_SHA::12}" .
      - name: Generate runtime SBOM and audit report
        shell: bash
        run: |
          set +e
          mkdir -p build/release-evidence
          python -m pip install pip-audit==2.10.1
          install_status=$?
          if [[ "$install_status" -eq 0 ]]; then
            python -m pip_audit --strict --no-deps --requirement requirements-runtime.lock --format cyclonedx-json --output build/release-evidence/runtime-sbom.cdx.json
            audit_status=$?
          else
            audit_status=$install_status
          fi
          set -e
          printf 'audit-tool install exit code: %s\nruntime audit/SBOM exit code: %s\n' "$install_status" "$audit_status"
          if [[ "$install_status" -ne 0 || "$audit_status" -ne 0 ]]; then
            echo "Release gate failed: runtime SBOM/audit could not be produced cleanly." >&2
            exit 1
          fi
      - name: Upload release verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tmrds-release-evidence-${{ github.sha }}
          path: |
            build-release-test-results.xml
            build/release-evidence/
          if-no-files-found: ignore
          retention-days: 90
