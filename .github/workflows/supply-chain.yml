name: TMRDS Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
      - name: Validate direct declarations against both lock files
        run: python scripts/check_dependency_lock.py
      - name: Audit both locks and retain machine-readable reports
        shell: bash
        run: |
          set +e
          mkdir -p build/audit
          pip-audit --strict --no-deps --requirement requirements.lock --format json --output build/audit/test-dependencies.json
          test_status=$?
          pip-audit --strict --no-deps --requirement requirements-runtime.lock --format json --output build/audit/runtime-dependencies.json
          runtime_status=$?
          set -e
          printf 'test dependency audit exit code: %s\nruntime dependency audit exit code: %s\n' "$test_status" "$runtime_status"
          if [[ "$test_status" -ne 0 || "$runtime_status" -ne 0 ]]; then
            echo "Dependency audit failed due to vulnerabilities or dependency collection errors." >&2
            exit 1
          fi
      - name: Upload machine-readable dependency audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmrds-dependency-audit
          path: build/audit/*.json
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    name: Review pull-request dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
