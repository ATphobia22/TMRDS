name: TMRDS Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
      - name: Audit both canonical dependency locks
        shell: bash
        run: |
          set +e
          mkdir -p build/audit
          python -m pip_audit --strict --requirement requirements.lock --format json --output build/audit/test-dependencies.json
          test_status=$?
          python -m pip_audit --strict --requirement requirements-runtime.lock --format json --output build/audit/runtime-dependencies.json
          runtime_status=$?
          set -e
          printf 'test dependency audit exit code: %s\nruntime dependency audit exit code: %s\n' "$test_status" "$runtime_status"
          if [[ "$test_status" -ne 0 || "$runtime_status" -ne 0 ]]; then
            echo "Dependency audit failed due to vulnerabilities or dependency collection errors." >&2
            exit 1
          fi
      - name: Upload machine-readable audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmrds-dependency-audit
          path: build/audit/*.json
          if-no-files-found: ignore
          retention-days: 30
