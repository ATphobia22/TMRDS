# Prometheus scrapes the TMRDS API's /metrics (RED metrics) every 15s over the
# internal backend network. Alertmanager receives firing alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "tmrds-api"
    static_configs:
      - targets: ["tmrds-api:8000"]
    metrics_path: "/metrics"
