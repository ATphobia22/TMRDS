server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;
    location / {
        proxy_pass http://imaging:8042;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
