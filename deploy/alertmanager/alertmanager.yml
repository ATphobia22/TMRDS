# Alertmanager: routes Prometheus alerts. The default receiver only logs.
# Configure a real receiver (email, webhook, PagerDuty) before relying on pages.
global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    # Placeholder: replace with a real notifier. Example webhook:
    # webhook_configs:
    #   - url: "https://hooks.example.invalid/tmrds-alerts"
