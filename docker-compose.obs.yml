# TMRDS observability + edge overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.obs.yml up -d
# The base file is untouched; this overlay adds the public edge (Caddy + TLS),
# metrics/alerting (Prometheus, Alertmanager, Grafana OSS), and Keycloak as
# the OIDC identity provider for the existing service-JWT validator.
#
# Required in .env (see .env.example): TMRDS_PUBLIC_HOST, TMRDS_AUTH_HOST,
# GRAFANA_ADMIN_USER, KEYCLOAK_ADMIN_USER.
# Secrets live in ./secrets/ (gitignored); copy each *.example to the real name.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      TMRDS_PUBLIC_HOST: ${TMRDS_PUBLIC_HOST:?Set TMRDS_PUBLIC_HOST}
      TMRDS_AUTH_HOST: ${TMRDS_AUTH_HOST:?Set TMRDS_AUTH_HOST}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - outbound # ACME HTTP-01/TLS-ALPN needs outbound
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend # scrapes tmrds-api:8000/metrics over the internal network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.5.0 # AGPL-3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - backend
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start", "--import-realm", "--http-enabled=true", "--proxy=edge", "--hostname-strict=false"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    volumes:
      - ./deploy/keycloak/realms:/opt/keycloak/data/import:ro
    networks:
      - backend
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  keycloak_db_password:
    file: ./secrets/keycloak_db_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt

networks:
  backend:
    name: tmrds_backend
  outbound:
    name: tmrds_outbound

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  keycloak_postgres_data:
