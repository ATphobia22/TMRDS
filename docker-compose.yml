services:
  tmrds-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tmrds}
      POSTGRES_USER: ${POSTGRES_USER:-tmrds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - tmrds-postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmrds} -d ${POSTGRES_DB:-tmrds}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tmrds-neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - tmrds-neo4j-data:/data
      - tmrds-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  tmrds-api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - TMRDS_ENV=production
      - TMRDS_HOST=0.0.0.0
      - TMRDS_PORT=8000
      - TMRDS_SESSION_TIMEOUT_MIN=15
      - TMRDS_AUDIT_LOG=/app/data/audit/access.jsonl
      - TMRDS_FHIR_VERSION=R4
      - TMRDS_DATABASE_URL=postgresql://${POSTGRES_USER:-tmrds}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@tmrds-postgres:5432/${POSTGRES_DB:-tmrds}
      - TMRDS_NEO4J_URI=bolt://tmrds-neo4j:7687
      - TMRDS_NEO4J_USER=${NEO4J_USER:-neo4j}
      - TMRDS_NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      tmrds-postgres:
        condition: service_healthy
      tmrds-neo4j:
        condition: service_healthy
    command: >
      bash -c "pip install -q -r requirements.txt &&
      mkdir -p data/audit data/research data/logs &&
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/research/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  tmrds-postgres-data:
  tmrds-neo4j-data:
  tmrds-neo4j-logs:
